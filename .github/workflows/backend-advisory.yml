name: Backend Advisory Analysis

on:
  workflow_call:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-advisory:
    name: Backend Advisory Checks
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run Gr8Books Neo Backend Analysis
        uses: integr8software/gr8booksneo-automation/.github/actions/backend-analysis@develop
        with:
          source-path: src
          tsconfig-path: tsconfig.json

      - name: Publish QA Summary
        if: always()
        shell: powershell
        run: |
          $report = Join-Path $env:GITHUB_WORKSPACE "reports\QA-Report.md"

          if (Test-Path $report) {
              Get-Content -Path $report -Raw |
                  Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding UTF8
          }
          else {
              "## Backend Advisory Analysis" |
                  Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding UTF8

              "" |
                  Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding UTF8

              "No combined QA report was generated." |
                  Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding UTF8
          }

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-advisory-reports-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14