name: Backend PR Quality

on:
  workflow_call:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  backend-pr-quality:
    name: Backend PR Quality
    runs-on: windows-latest

    timeout-minutes: 30

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Resolve QA references
        id: refs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ("${{ github.event_name }}" -eq "pull_request") {
            $baseReference = "${{ github.event.pull_request.base.sha }}"
            $headReference = "${{ github.event.pull_request.head.sha }}"
          }
          elseif ("${{ github.event_name }}" -eq "push") {
            $baseReference = "${{ github.event.before }}"
            $headReference = "${{ github.sha }}"

            if ([string]::IsNullOrWhiteSpace($baseReference) -or $baseReference -match '^0+$') {
              git fetch --no-tags origin develop
              if ($LASTEXITCODE -ne 0) {
                throw "Unable to fetch origin/develop."
              }

              $baseReference = git merge-base origin/develop $headReference
              if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($baseReference)) {
                throw "Unable to resolve first-push comparison base."
              }
            }
          }
          else {
            $headReference = git rev-parse HEAD
            git fetch --no-tags origin develop
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to fetch origin/develop."
            }
            $baseReference = git merge-base origin/develop $headReference
          }

          "base-reference=$baseReference" >> $env:GITHUB_OUTPUT
          "head-reference=$headReference" >> $env:GITHUB_OUTPUT

          Write-Host "QA base: $baseReference"
          Write-Host "QA head: $headReference"

      - name: Run backend PR quality analysis
        uses: integr8software/gr8booksneo-automation/.github/actions/backend-analysis@develop
        with:
          repository-root: ${{ github.workspace }}
          tsconfig-path: tsconfig.json
          base-reference: ${{ steps.refs.outputs.base-reference }}
          head-reference: ${{ steps.refs.outputs.head-reference }}
          maximum-findings-per-tool: "10"

      - name: Upload backend PR quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pr-quality-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  publish-pr-preview:
    name: Publish PR Dashboard Preview
    needs: backend-pr-quality
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Download backend PR quality reports
        uses: actions/download-artifact@v4
        with:
          name: backend-pr-quality-${{ github.run_number }}
          path: ${{ runner.temp }}/backend-pr-quality

      - name: Verify dashboard PNG
        id: dashboard
        shell: bash
        run: |
          image_path="${RUNNER_TEMP}/backend-pr-quality/QA-Report.png"

          if [[ -f "$image_path" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Dashboard image found: $image_path"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Dashboard image was not generated."
          fi

      - name: Checkout report publishing branch
        if: steps.dashboard.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Publish dashboard PNG
        if: steps.dashboard.outputs.available == 'true'
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin qa-reports >/dev/null 2>&1; then
            git fetch origin qa-reports
            git switch --force-create qa-reports origin/qa-reports
          else
            git switch --orphan qa-reports
            git rm -rf . >/dev/null 2>&1 || true
          fi

          report_directory="pr-${PR_NUMBER}"
          mkdir -p "$report_directory"

          cp \
            "${RUNNER_TEMP}/backend-pr-quality/QA-Report.png" \
            "${report_directory}/QA-Report.png"

          git add "${report_directory}/QA-Report.png"

          if git diff --cached --quiet; then
            echo "Dashboard image is already current."
          else
            git commit -m "QA: update dashboard for PR #${PR_NUMBER}"
            git push origin qa-reports
          fi

      - name: Create or update PR dashboard comment
        if: always()
        uses: actions/github-script@v7
        env:
          DASHBOARD_AVAILABLE: ${{ steps.dashboard.outputs.available }}
          ANALYSIS_RESULT: ${{ needs.backend-pr-quality.result }}
        with:
          script: |
            const marker = "<!-- gr8books-backend-pr-quality -->";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.issue.number;
            const runUrl =
              `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const passed = process.env.ANALYSIS_RESULT === "success";

            let dashboardSection = `
            > The dashboard image was not generated. Open the workflow run for details.
            `;

            if (process.env.DASHBOARD_AVAILABLE === "true") {
              const imageUrl =
                `${context.serverUrl}/${owner}/${repo}/blob/qa-reports/` +
                `pr-${issueNumber}/QA-Report.png?raw=1&run=${context.runId}`;

              dashboardSection = `
            <details>
            <summary><strong>📊 View QA Dashboard</strong></summary>

            ![Backend PR Quality Dashboard](${imageUrl})

            </details>
              `;
            }

            const body = `${marker}
            ## ${passed ? "✅ Ready for Review" : "❌ QA Review Required"}

            ${dashboardSection}

            [Open the complete workflow run](${runUrl})

            _This comment is automatically updated after every push to this PR._
            `;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100
              }
            );

            const existingComment = comments.find(
              comment =>
                comment.user?.type === "Bot" &&
                comment.body?.includes(marker)
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body
              });
            }