name: Backend PR Quality

on:
  workflow_call:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-pr-quality:
    name: Backend PR Quality
    runs-on: windows-latest

    timeout-minutes: 30

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run backend PR quality analysis
        uses: integr8software/gr8booksneo-automation/.github/actions/backend-analysis@develop
        with:
          repository-root: ${{ github.workspace }}
          tsconfig-path: tsconfig.json
          base-reference: ${{ github.event.pull_request.base.sha }}
          head-reference: ${{ github.event.pull_request.head.sha }}
          maximum-findings-per-tool: "10"

      - name: Upload backend PR quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pr-quality-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14