name: Backend Advisory Analysis

on:
  workflow_call:
    inputs:
      toolkit-ref:
        description: Automation toolkit branch
        required: false
        type: string
        default: develop

  workflow_dispatch:
    inputs:
      toolkit-ref:
        description: Automation toolkit branch
        required: false
        default: develop

permissions:
  contents: read

jobs:
  backend-advisory:
    name: Backend Advisory Checks
    runs-on: [self-hosted, Windows, X64]

    timeout-minutes: 30

    continue-on-error: true

    steps:

      - name: Checkout Target Repository
        uses: actions/checkout@v4

      - name: Checkout QA Toolkit
        uses: actions/checkout@v4
        with:
          repository: integr8software/gr8booksneo-automation
          ref: ${{ inputs.toolkit-ref }}
          path: qa-toolkit

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: qa-toolkit/package-lock.json

      - name: Run Backend Analysis
        uses: ./qa-toolkit/.github/actions/backend-analysis
        with:
          source-path: src
          tsconfig-path: tsconfig.json

      - name: Publish QA Summary
        if: always()
        shell: powershell
        run: |

          $report = Join-Path $env:GITHUB_WORKSPACE "reports\QA-Report.md"

          if (Test-Path $report)
          {
              Get-Content $report -Raw |
                  Add-Content $env:GITHUB_STEP_SUMMARY
          }
          else
          {
              "## QA Report" |
                  Add-Content $env:GITHUB_STEP_SUMMARY

              "No report generated." |
                  Add-Content $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-advisory-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14