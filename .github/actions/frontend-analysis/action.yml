name: Frontend PR Quality Analysis
description: Run frontend PR quality detectors and generate JSON, Markdown, HTML, and PNG reports.

inputs:
  repository-root:
    description: Absolute path to the checked-out frontend repository.
    required: true

  base-reference:
    description: Base commit SHA or branch used for PR diff analysis.
    required: true

  head-reference:
    description: Head commit SHA or branch used for PR diff analysis.
    required: true

  maximum-findings-per-rule:
    description: Maximum number of findings retained for each rule.
    required: false
    default: "50"

  fail-on-blockers:
    description: Fail the action when blocker findings exist.
    required: false
    default: "true"

  fail-on-warnings:
    description: Fail the action when warning findings exist.
    required: false
    default: "false"

outputs:
  report-json:
    description: Absolute path to the generated frontend JSON report.
    value: ${{ steps.paths.outputs.report-json }}

  report-markdown:
    description: Absolute path to the generated frontend Markdown report.
    value: ${{ steps.paths.outputs.report-markdown }}

  report-html:
    description: Absolute path to the generated frontend HTML report.
    value: ${{ steps.paths.outputs.report-html }}

  report-png:
    description: Absolute path to the generated frontend PNG report.
    value: ${{ steps.paths.outputs.report-png }}

  decision:
    description: Frontend PR quality decision label.
    value: ${{ steps.result.outputs.decision }}

  status:
    description: Frontend PR quality status.
    value: ${{ steps.result.outputs.status }}

  blockers:
    description: Number of blocker findings.
    value: ${{ steps.result.outputs.blockers }}

  warnings:
    description: Number of warning findings.
    value: ${{ steps.result.outputs.warnings }}

  findings:
    description: Total number of findings.
    value: ${{ steps.result.outputs.findings }}

runs:
  using: composite

  steps:
    - name: Resolve frontend QA paths
      id: paths
      shell: powershell
      env:
        INPUT_REPOSITORY_ROOT: ${{ inputs.repository-root }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        $ErrorActionPreference = "Stop"

        $automationRoot = [System.IO.Path]::GetFullPath(
          (Join-Path $env:ACTION_PATH "..\..\..")
        )

        $repositoryRoot = [System.IO.Path]::GetFullPath(
          $env:INPUT_REPOSITORY_ROOT
        )

        if (-not (Test-Path -LiteralPath $automationRoot -PathType Container)) {
          throw "Automation root does not exist: $automationRoot"
        }

        if (-not (Test-Path -LiteralPath $repositoryRoot -PathType Container)) {
          throw "Frontend repository root does not exist: $repositoryRoot"
        }

        $reportsDirectory = Join-Path $repositoryRoot "reports"

        $reportJson = Join-Path `
          $reportsDirectory `
          "frontend-quality-results.json"

        $reportMarkdown = Join-Path `
          $reportsDirectory `
          "Frontend-QA-Report.md"

        $reportHtml = Join-Path `
          $reportsDirectory `
          "Frontend-QA-Report.html"

        $reportPng = Join-Path `
          $reportsDirectory `
          "Frontend-QA-Report.png"

        New-Item `
          -ItemType Directory `
          -Path $reportsDirectory `
          -Force |
          Out-Null

        "automation-root=$automationRoot" >> $env:GITHUB_OUTPUT
        "repository-root=$repositoryRoot" >> $env:GITHUB_OUTPUT
        "reports-directory=$reportsDirectory" >> $env:GITHUB_OUTPUT
        "report-json=$reportJson" >> $env:GITHUB_OUTPUT
        "report-markdown=$reportMarkdown" >> $env:GITHUB_OUTPUT
        "report-html=$reportHtml" >> $env:GITHUB_OUTPUT
        "report-png=$reportPng" >> $env:GITHUB_OUTPUT

        Write-Host ""
        Write-Host "Frontend QA paths"
        Write-Host "-----------------"
        Write-Host "Automation root : $automationRoot"
        Write-Host "Repository root : $repositoryRoot"
        Write-Host "Reports         : $reportsDirectory"
        Write-Host ""

    - name: Verify frontend QA files
      shell: powershell
      env:
        AUTOMATION_ROOT: ${{ steps.paths.outputs.automation-root }}
      run: |
        $ErrorActionPreference = "Stop"

        $requiredFiles = @(
          "package.json",
          "package-lock.json",
          "configs\frontend-standards.json",
          "schemas\frontend-resultschema.json",
          "scripts\frontend\analyze-frontend.mjs",
          "scripts\frontend\generate-summary.ps1",
          "scripts\frontend\capture-dashboard.mjs",
          "scripts\detector\hooks.mjs",
          "scripts\detector\types.mjs",
          "scripts\detector\fetching.mjs",
          "scripts\detector\structure.mjs",
          "scripts\detector\ui.mjs",
          "scripts\detector\constants.mjs",
          "scripts\detector\data.mjs"
        )

        foreach ($relativePath in $requiredFiles) {
          $absolutePath = Join-Path `
            $env:AUTOMATION_ROOT `
            $relativePath

          if (-not (Test-Path -LiteralPath $absolutePath -PathType Leaf)) {
            throw "Required frontend QA file is missing: $absolutePath"
          }
        }

        Write-Host "Frontend QA files verified."

    - name: Verify Node.js
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"

        node --version
        npm --version

    - name: Install frontend QA dependencies
      shell: powershell
      env:
        AUTOMATION_ROOT: ${{ steps.paths.outputs.automation-root }}
      run: |
        $ErrorActionPreference = "Stop"

        Push-Location $env:AUTOMATION_ROOT

        try {
          npm ci

          if ($LASTEXITCODE -ne 0) {
            throw "npm ci failed with exit code $LASTEXITCODE."
          }

          npx playwright install chromium

          if ($LASTEXITCODE -ne 0) {
            throw "Playwright Chromium installation failed with exit code $LASTEXITCODE."
          }
        }
        finally {
          Pop-Location
        }

    - name: Verify frontend QA modules
      shell: powershell
      env:
        AUTOMATION_ROOT: ${{ steps.paths.outputs.automation-root }}
      run: |
        $ErrorActionPreference = "Stop"

        Push-Location $env:AUTOMATION_ROOT

        try {
          node -e "import('playwright').then(() => console.log('Playwright package is available.'))"

          if ($LASTEXITCODE -ne 0) {
            throw "Playwright module verification failed."
          }

          node -e "import('./scripts/frontend/analyze-frontend.mjs').then(m => { if (typeof m.analyzeFrontend !== 'function') throw new Error('analyzeFrontend export is missing'); console.log('Frontend analyzer is available.'); })"

          if ($LASTEXITCODE -ne 0) {
            throw "Frontend analyzer verification failed."
          }
        }
        finally {
          Pop-Location
        }

    - name: Run frontend quality analysis
      id: analyze
      shell: powershell
      env:
        AUTOMATION_ROOT: ${{ steps.paths.outputs.automation-root }}
        REPOSITORY_ROOT: ${{ steps.paths.outputs.repository-root }}
        REPORTS_DIRECTORY: ${{ steps.paths.outputs.reports-directory }}
        BASE_REFERENCE: ${{ inputs.base-reference }}
        HEAD_REFERENCE: ${{ inputs.head-reference }}
        MAXIMUM_FINDINGS: ${{ inputs.maximum-findings-per-rule }}
        FAIL_ON_BLOCKERS: ${{ inputs.fail-on-blockers }}
        FAIL_ON_WARNINGS: ${{ inputs.fail-on-warnings }}
      run: |
        $ErrorActionPreference = "Continue"

        Push-Location $env:AUTOMATION_ROOT

        try {
          $arguments = @(
            ".\scripts\frontend\analyze-frontend.mjs",
            "--repository-root",
            $env:REPOSITORY_ROOT,
            "--base",
            $env:BASE_REFERENCE,
            "--head",
            $env:HEAD_REFERENCE,
            "--output-directory",
            $env:REPORTS_DIRECTORY,
            "--maximum-findings-per-rule",
            $env:MAXIMUM_FINDINGS,
            "--verbose"
          )

          if ($env:FAIL_ON_BLOCKERS -eq "true") {
            $arguments += "--fail-on-blockers"
          }
          else {
            $arguments += "--no-fail-on-blockers"
          }

          if ($env:FAIL_ON_WARNINGS -eq "true") {
            $arguments += "--fail-on-warnings"
          }
          else {
            $arguments += "--no-fail-on-warnings"
          }

          & node @arguments
          $analysisExitCode = $LASTEXITCODE

          "analysis-exit-code=$analysisExitCode" >> $env:GITHUB_OUTPUT

          if (
            $analysisExitCode -ne 0 -and
            $analysisExitCode -ne 1
          ) {
            throw "Frontend analyzer failed with exit code $analysisExitCode."
          }
        }
        finally {
          Pop-Location
        }

        exit 0

    - name: Generate frontend QA summary
      if: always()
      shell: powershell
      env:
        AUTOMATION_ROOT: ${{ steps.paths.outputs.automation-root }}
        REPORT_JSON: ${{ steps.paths.outputs.report-json }}
        REPORTS_DIRECTORY: ${{ steps.paths.outputs.reports-directory }}
        MAXIMUM_FINDINGS: ${{ inputs.maximum-findings-per-rule }}
      run: |
        $ErrorActionPreference = "Stop"

        if (-not (Test-Path -LiteralPath $env:REPORT_JSON -PathType Leaf)) {
          throw "Frontend JSON report was not generated: $env:REPORT_JSON"
        }

        $summaryScript = Join-Path `
          $env:AUTOMATION_ROOT `
          "scripts\frontend\generate-summary.ps1"

        powershell `
          -NoProfile `
          -ExecutionPolicy Bypass `
          -File $summaryScript `
          -InputPath $env:REPORT_JSON `
          -OutputDirectory $env:REPORTS_DIRECTORY `
          -MaximumFindings ([int]$env:MAXIMUM_FINDINGS)

        if ($LASTEXITCODE -ne 0) {
          throw "Frontend QA summary generation failed with exit code $LASTEXITCODE."
        }

    - name: Capture frontend QA dashboard
      if: always()
      shell: powershell
      env:
        AUTOMATION_ROOT: ${{ steps.paths.outputs.automation-root }}
        REPORT_HTML: ${{ steps.paths.outputs.report-html }}
        REPORT_PNG: ${{ steps.paths.outputs.report-png }}
      run: |
        $ErrorActionPreference = "Stop"

        if (-not (Test-Path -LiteralPath $env:REPORT_HTML -PathType Leaf)) {
          throw "Frontend HTML report was not generated: $env:REPORT_HTML"
        }

        $captureScript = Join-Path `
          $env:AUTOMATION_ROOT `
          "scripts\frontend\capture-dashboard.mjs"

        Push-Location $env:AUTOMATION_ROOT

        try {
          node $captureScript `
            --html $env:REPORT_HTML `
            --output $env:REPORT_PNG `
            --width 1440 `
            --height 1200 `
            --full-page

          if ($LASTEXITCODE -ne 0) {
            throw "Frontend dashboard capture failed with exit code $LASTEXITCODE."
          }
        }
        finally {
          Pop-Location
        }

        if (-not (Test-Path -LiteralPath $env:REPORT_PNG -PathType Leaf)) {
          throw "Frontend PNG report was not generated: $env:REPORT_PNG"
        }

        $pngSize = (Get-Item -LiteralPath $env:REPORT_PNG).Length

        if ($pngSize -le 0) {
          throw "Frontend PNG report is empty: $env:REPORT_PNG"
        }

        Write-Host "Frontend dashboard PNG size: $pngSize bytes"

    - name: Read frontend QA result
      if: always()
      id: result
      shell: powershell
      env:
        REPORT_JSON: ${{ steps.paths.outputs.report-json }}
      run: |
        $ErrorActionPreference = "Stop"

        if (-not (Test-Path -LiteralPath $env:REPORT_JSON -PathType Leaf)) {
          throw "Frontend QA report was not generated: $env:REPORT_JSON"
        }

        $report = Get-Content `
          -LiteralPath $env:REPORT_JSON `
          -Raw `
          -Encoding UTF8 |
          ConvertFrom-Json

        $decision = [string]$report.decision.label
        $status = [string]$report.decision.status
        $blockers = [int]$report.summary.blockers
        $warnings = [int]$report.summary.warnings
        $findings = [int]$report.summary.total

        "decision=$decision" >> $env:GITHUB_OUTPUT
        "status=$status" >> $env:GITHUB_OUTPUT
        "blockers=$blockers" >> $env:GITHUB_OUTPUT
        "warnings=$warnings" >> $env:GITHUB_OUTPUT
        "findings=$findings" >> $env:GITHUB_OUTPUT

        Write-Host ""
        Write-Host "Frontend PR Quality Result"
        Write-Host "--------------------------"
        Write-Host "Decision : $decision"
        Write-Host "Status   : $status"
        Write-Host "Findings : $findings"
        Write-Host "Blockers : $blockers"
        Write-Host "Warnings : $warnings"
        Write-Host ""

    - name: Write GitHub job summary
      if: always()
      shell: powershell
      env:
        REPORT_JSON: ${{ steps.paths.outputs.report-json }}
      run: |
        $ErrorActionPreference = "Stop"

        if (-not (Test-Path -LiteralPath $env:REPORT_JSON -PathType Leaf)) {
          Write-Warning "Frontend JSON report is unavailable; GitHub summary was not generated."
          exit 0
        }

        $report = Get-Content `
          -LiteralPath $env:REPORT_JSON `
          -Raw `
          -Encoding UTF8 |
          ConvertFrom-Json

        $decision = [string]$report.decision.label
        $status = [string]$report.decision.status
        $changedFiles = [int]$report.analysis.changedFileCount
        $findings = [int]$report.summary.total
        $blockers = [int]$report.summary.blockers
        $warnings = [int]$report.summary.warnings
        $information = [int]$report.summary.info

        $icon = switch ($status) {
          "blocked" { "❌" }
          "warning" { "⚠️" }
          default { "✅" }
        }

        @"
        # $icon Frontend PR Quality

        **Decision:** $decision

        | Metric | Count |
        |---|---:|
        | Changed files | $changedFiles |
        | Findings | $findings |
        | Blockers | $blockers |
        | Warnings | $warnings |
        | Information | $information |

        Generated reports:

        - ``frontend-quality-results.json``
        - ``Frontend-QA-Report.md``
        - ``Frontend-QA-Report.html``
        - ``Frontend-QA-Report.png``
        "@ >> $env:GITHUB_STEP_SUMMARY

    - name: Build frontend repository
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"

        # CI-only build value required by server-side API URL resolution during next build.
        $env:NEXT_PUBLIC_API_BASE_URL = "http://127.0.0.1:3000/api/v1"

        Push-Location "${{ inputs.repository-root }}"

        try {
          Write-Host "Installing frontend repository dependencies..."
          npm ci

          if ($LASTEXITCODE -ne 0) {
            throw "Frontend npm ci failed with exit code $LASTEXITCODE."
          }

          Write-Host "Running frontend production build..."
          npm run build

          if ($LASTEXITCODE -ne 0) {
            throw "Frontend npm run build failed with exit code $LASTEXITCODE."
          }

          Write-Host "Frontend build passed."
        }
        finally {
          Pop-Location
        }

    - name: Enforce frontend QA decision
      if: always()
      shell: powershell
      env:
        ANALYSIS_EXIT_CODE: ${{ steps.analyze.outputs.analysis-exit-code }}
      run: |
        $ErrorActionPreference = "Stop"

        if ([string]::IsNullOrWhiteSpace($env:ANALYSIS_EXIT_CODE)) {
          throw "Frontend analyzer did not provide an exit code."
        }

        $analysisExitCode = [int]$env:ANALYSIS_EXIT_CODE

        switch ($analysisExitCode) {
          0 {
            Write-Host "Frontend PR quality checks passed."
            exit 0
          }

          1 {
            throw "Frontend PR quality checks require changes."
          }

          default {
            throw "Frontend PR quality analysis failed with exit code $analysisExitCode."
          }
        }