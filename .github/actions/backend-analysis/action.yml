name: Gr8Books Neo Backend PR Analysis

description: >
  Runs PR-focused Madge, Knip, and Semgrep analysis and generates
  a developer-friendly quality summary.

inputs:
  repository-root:
    description: Absolute path of the checked-out backend repository
    required: false
    default: ""

  tsconfig-path:
    description: TypeScript configuration path relative to the backend repository
    required: false
    default: "tsconfig.json"

  base-reference:
    description: Base commit SHA or Git reference used for PR comparison
    required: true

  head-reference:
    description: Head commit SHA or Git reference used for PR comparison
    required: true

  maximum-findings-per-tool:
    description: Maximum findings displayed for each analyzer
    required: false
    default: "10"

outputs:
  overall-status:
    description: Overall QA status
    value: ${{ steps.summary.outputs.overall_status }}

  blocking-result-count:
    description: Number of blocking analyzer results
    value: ${{ steps.summary.outputs.blocking_result_count }}

  blocking-finding-count:
    description: Number of blocking findings
    value: ${{ steps.summary.outputs.blocking_finding_count }}

  advisory-finding-count:
    description: Number of advisory findings
    value: ${{ steps.summary.outputs.advisory_finding_count }}

  summary-path:
    description: Generated Markdown summary path
    value: ${{ steps.summary.outputs.summary_path }}

runs:
  using: composite

  steps:
    - name: Resolve QA paths
      id: paths
      shell: pwsh
      env:
        INPUT_REPOSITORY_ROOT: ${{ inputs.repository-root }}
      run: |
        $ErrorActionPreference = "Stop"

        $toolkitRoot = [System.IO.Path]::GetFullPath(
          (Join-Path $env:GITHUB_ACTION_PATH "..\..\..")
        )

        if ([string]::IsNullOrWhiteSpace($env:INPUT_REPOSITORY_ROOT)) {
          $repositoryRoot = [System.IO.Path]::GetFullPath(
            $env:GITHUB_WORKSPACE
          )
        }
        else {
          $repositoryRoot = [System.IO.Path]::GetFullPath(
            $env:INPUT_REPOSITORY_ROOT
          )
        }

        if (-not (Test-Path -LiteralPath $toolkitRoot -PathType Container)) {
          throw "Toolkit root does not exist: $toolkitRoot"
        }

        if (-not (Test-Path -LiteralPath $repositoryRoot -PathType Container)) {
          throw "Repository root does not exist: $repositoryRoot"
        }

        $reportsRoot = Join-Path $repositoryRoot "reports"
        $rawDirectory = Join-Path $reportsRoot "raw"
        $resultsDirectory = Join-Path $reportsRoot "results"

        New-Item `
          -ItemType Directory `
          -Path $rawDirectory `
          -Force |
          Out-Null

        New-Item `
          -ItemType Directory `
          -Path $resultsDirectory `
          -Force |
          Out-Null

        $changedFilesPath = Join-Path $rawDirectory "changed-files.json"
        $summaryPath = Join-Path $reportsRoot "Backend-PR-Quality.md"
        $buildResultPath = Join-Path $reportsRoot "backend-build-result.json"

        "toolkit_root=$toolkitRoot" >> $env:GITHUB_OUTPUT
        "repository_root=$repositoryRoot" >> $env:GITHUB_OUTPUT
        "reports_root=$reportsRoot" >> $env:GITHUB_OUTPUT
        "raw_directory=$rawDirectory" >> $env:GITHUB_OUTPUT
        "results_directory=$resultsDirectory" >> $env:GITHUB_OUTPUT
        "changed_files_path=$changedFilesPath" >> $env:GITHUB_OUTPUT
        "summary_path=$summaryPath" >> $env:GITHUB_OUTPUT
        "build_result_path=$buildResultPath" >> $env:GITHUB_OUTPUT

        Write-Host "Toolkit root: $toolkitRoot"
        Write-Host "Backend repository root: $repositoryRoot"
        Write-Host "Reports root: $reportsRoot"

    - name: Check branch freshness
      id: branch_freshness
      continue-on-error: true
      shell: pwsh
      env:
        REPOSITORY_ROOT: ${{ inputs.repository-root }}
        BASE_REFERENCE: ${{ inputs.base-reference }}
        HEAD_REFERENCE: ${{ inputs.head-reference }}
      run: |
        $ErrorActionPreference = "Stop"

        Push-Location $env:REPOSITORY_ROOT

        try {
          $baseReference = $env:BASE_REFERENCE
          $headReference = $env:HEAD_REFERENCE

          if (
            [string]::IsNullOrWhiteSpace($baseReference) -or
            [string]::IsNullOrWhiteSpace($headReference)
          ) {
            throw "Branch freshness requires both base and head references."
          }

          git cat-file -e "$baseReference^{commit}" 2>$null

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Fetching missing base commit..."
            git fetch --no-tags origin $baseReference

            if ($LASTEXITCODE -ne 0) {
              throw "Unable to fetch the PR base commit for branch freshness validation."
            }
          }

          git cat-file -e "$headReference^{commit}" 2>$null

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Fetching missing head commit..."
            git fetch --no-tags origin $headReference

            if ($LASTEXITCODE -ne 0) {
              throw "Unable to fetch the PR head commit for branch freshness validation."
            }
          }

          git merge-base --is-ancestor $baseReference $headReference
          $isUpToDate = ($LASTEXITCODE -eq 0)

          $behindCountText = git rev-list --count "$headReference..$baseReference"

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to calculate how far the branch is behind its PR base."
          }

          $behindCount = [int]$behindCountText.Trim()
          "behind-count=$behindCount" >> $env:GITHUB_OUTPUT

          if ($isUpToDate) {
            "status=up-to-date" >> $env:GITHUB_OUTPUT

            Write-Host "Branch freshness: PASSED"
            Write-Host "The PR branch contains the latest base commit."

            "### Branch Freshness" >> $env:GITHUB_STEP_SUMMARY
            "**Up to date** - the PR branch contains the latest base commit." >> $env:GITHUB_STEP_SUMMARY

            exit 0
          }

          "status=outdated" >> $env:GITHUB_OUTPUT

          "### Branch Freshness" >> $env:GITHUB_STEP_SUMMARY
          "**Outdated branch** - this PR is $behindCount commit(s) behind its base branch." >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "Update the feature branch before merging:" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          '```powershell' >> $env:GITHUB_STEP_SUMMARY
          "git fetch origin" >> $env:GITHUB_STEP_SUMMARY
          "git merge origin/develop" >> $env:GITHUB_STEP_SUMMARY
          "git push" >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY

          Write-Error "Branch is outdated: $behindCount commit(s) behind the PR base. Merge the latest develop into the feature branch, then push again."
          exit 1
        }
        finally {
          Pop-Location
        }

    - name: Install QA toolkit dependencies
      shell: pwsh
      env:
        TOOLKIT_ROOT: ${{ steps.paths.outputs.toolkit_root }}
      run: |
        $ErrorActionPreference = "Stop"

        Push-Location $env:TOOLKIT_ROOT

        try {
          npm ci
        }
        finally {
          Pop-Location
        }

    - name: Setup Python for Semgrep
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Semgrep
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        python -m pip install --upgrade pip
        python -m pip install semgrep

        semgrep --version
    - name: Verify QA tools
      shell: pwsh
      env:
        TOOLKIT_ROOT: ${{ steps.paths.outputs.toolkit_root }}
      run: |
        $ErrorActionPreference = "Stop"

        Push-Location $env:TOOLKIT_ROOT

        try {
          npm run verify:tools
        }
        finally {
          Pop-Location
        }

    - name: Determine PR changed files
      id: changed-files
      shell: pwsh
      env:
        TOOLKIT_ROOT: ${{ steps.paths.outputs.toolkit_root }}
        REPOSITORY_ROOT: ${{ steps.paths.outputs.repository_root }}
        CHANGED_FILES_PATH: ${{ steps.paths.outputs.changed_files_path }}
        BASE_REFERENCE: ${{ inputs.base-reference }}
        HEAD_REFERENCE: ${{ inputs.head-reference }}
      run: |
        $ErrorActionPreference = "Stop"

        $commonScript = Join-Path `
          $env:TOOLKIT_ROOT `
          "scripts\common.ps1"

        if (-not (Test-Path -LiteralPath $commonScript -PathType Leaf)) {
          throw "Required common script was not found: $commonScript"
        }

        . $commonScript

        Write-QaLog `
          -Level "INFO" `
          -Message "Comparing $env:BASE_REFERENCE...$env:HEAD_REFERENCE"

        $changedFiles = @(
          Get-QaChangedFiles `
            -RepositoryRoot $env:REPOSITORY_ROOT `
            -BaseReference $env:BASE_REFERENCE `
            -HeadReference $env:HEAD_REFERENCE
        )

        $changedFileCount = @($changedFiles).Count

        $changedFilesDocument = [ordered]@{
          baseReference = $env:BASE_REFERENCE
          headReference = $env:HEAD_REFERENCE
          count = $changedFileCount
          files = @($changedFiles)
        }

        Write-QaJson `
          -Value $changedFilesDocument `
          -Path $env:CHANGED_FILES_PATH |
          Out-Null

        "count=$changedFileCount" >> $env:GITHUB_OUTPUT

        Write-QaLog `
          -Level "SUCCESS" `
          -Message "$changedFileCount changed file(s) detected."

        foreach ($file in $changedFiles) {
          Write-Host " - $file"
        }

    - name: Run Madge circular dependency analysis
      id: madge
      continue-on-error: true
      shell: pwsh
      env:
        TOOLKIT_ROOT: ${{ steps.paths.outputs.toolkit_root }}
        REPOSITORY_ROOT: ${{ steps.paths.outputs.repository_root }}
        CHANGED_FILES_PATH: ${{ steps.paths.outputs.changed_files_path }}
        RESULTS_DIRECTORY: ${{ steps.paths.outputs.results_directory }}
        RAW_DIRECTORY: ${{ steps.paths.outputs.raw_directory }}
        TSCONFIG_PATH: ${{ inputs.tsconfig-path }}
      run: |
        $scriptPath = Join-Path `
          $env:TOOLKIT_ROOT `
          "scripts\invoke-madge.ps1"

        $resultPath = Join-Path `
          $env:RESULTS_DIRECTORY `
          "madge-result.json"

        $rawOutputPath = Join-Path `
          $env:RAW_DIRECTORY `
          "madge-raw.json"

        & $scriptPath `
          -ToolkitRoot $env:TOOLKIT_ROOT `
          -RepositoryRoot $env:REPOSITORY_ROOT `
          -TsConfigPath $env:TSCONFIG_PATH `
          -ChangedFilesPath $env:CHANGED_FILES_PATH `
          -ResultPath $resultPath `
          -RawOutputPath $rawOutputPath

        exit $LASTEXITCODE

    - name: Run Knip unused code analysis
      id: knip
      continue-on-error: true
      shell: pwsh
      env:
        TOOLKIT_ROOT: ${{ steps.paths.outputs.toolkit_root }}
        REPOSITORY_ROOT: ${{ steps.paths.outputs.repository_root }}
        CHANGED_FILES_PATH: ${{ steps.paths.outputs.changed_files_path }}
        RESULTS_DIRECTORY: ${{ steps.paths.outputs.results_directory }}
        RAW_DIRECTORY: ${{ steps.paths.outputs.raw_directory }}
      run: |
        $scriptPath = Join-Path `
          $env:TOOLKIT_ROOT `
          "scripts\invoke-knip.ps1"

        $configPath = Join-Path `
          $env:TOOLKIT_ROOT `
          "configs\knip.json"

        $resultPath = Join-Path `
          $env:RESULTS_DIRECTORY `
          "knip-result.json"

        $rawOutputPath = Join-Path `
          $env:RAW_DIRECTORY `
          "knip-raw.json"

        & $scriptPath `
          -ToolkitRoot $env:TOOLKIT_ROOT `
          -RepositoryRoot $env:REPOSITORY_ROOT `
          -ConfigPath $configPath `
          -ChangedFilesPath $env:CHANGED_FILES_PATH `
          -ResultPath $resultPath `
          -RawOutputPath $rawOutputPath

        exit $LASTEXITCODE

    - name: Run Semgrep security analysis
      id: semgrep
      continue-on-error: true
      shell: pwsh
      env:
        TOOLKIT_ROOT: ${{ steps.paths.outputs.toolkit_root }}
        REPOSITORY_ROOT: ${{ steps.paths.outputs.repository_root }}
        CHANGED_FILES_PATH: ${{ steps.paths.outputs.changed_files_path }}
        RESULTS_DIRECTORY: ${{ steps.paths.outputs.results_directory }}
        RAW_DIRECTORY: ${{ steps.paths.outputs.raw_directory }}
      run: |
        $scriptPath = Join-Path `
          $env:TOOLKIT_ROOT `
          "scripts\invoke-semgrep.ps1"

        $configPath = Join-Path `
          $env:TOOLKIT_ROOT `
          "configs\semgrep.yml"

        $resultPath = Join-Path `
          $env:RESULTS_DIRECTORY `
          "semgrep-result.json"

        $rawOutputPath = Join-Path `
          $env:RAW_DIRECTORY `
          "semgrep-raw.json"

        & $scriptPath `
          -ToolkitRoot $env:TOOLKIT_ROOT `
          -RepositoryRoot $env:REPOSITORY_ROOT `
          -ConfigPath $configPath `
          -ChangedFilesPath $env:CHANGED_FILES_PATH `
          -ResultPath $resultPath `
          -RawOutputPath $rawOutputPath

        exit $LASTEXITCODE

    - name: Run backend Swagger and Jest requirements check
      id: backend_requirements
      continue-on-error: true
      shell: pwsh
      env:
        TOOLKIT_ROOT: ${{ steps.paths.outputs.toolkit_root }}
        REPOSITORY_ROOT: ${{ steps.paths.outputs.repository_root }}
        CHANGED_FILES_PATH: ${{ steps.paths.outputs.changed_files_path }}
        RESULTS_DIRECTORY: ${{ steps.paths.outputs.results_directory }}
        RAW_DIRECTORY: ${{ steps.paths.outputs.raw_directory }}
        BASE_REFERENCE: ${{ inputs.base-reference }}
        HEAD_REFERENCE: ${{ inputs.head-reference }}
      run: |
        $scriptPath = Join-Path `
          $env:TOOLKIT_ROOT `
          "scripts\invoke-backend-requirements.ps1"

        $resultPath = Join-Path `
          $env:RESULTS_DIRECTORY `
          "backend-requirements-result.json"

        $rawOutputPath = Join-Path `
          $env:RAW_DIRECTORY `
          "backend-requirements-raw.json"

        & $scriptPath `
          -ToolkitRoot $env:TOOLKIT_ROOT `
          -RepositoryRoot $env:REPOSITORY_ROOT `
          -ChangedFilesPath $env:CHANGED_FILES_PATH `
          -BaseReference $env:BASE_REFERENCE `
          -HeadReference $env:HEAD_REFERENCE `
          -ResultPath $resultPath `
          -RawOutputPath $rawOutputPath

        exit $LASTEXITCODE

    - name: Generate developer-friendly summary
      id: summary
      if: always()
      continue-on-error: true
      shell: pwsh
      env:
        TOOLKIT_ROOT: ${{ steps.paths.outputs.toolkit_root }}
        RESULTS_DIRECTORY: ${{ steps.paths.outputs.results_directory }}
        CHANGED_FILES_PATH: ${{ steps.paths.outputs.changed_files_path }}
        SUMMARY_PATH: ${{ steps.paths.outputs.summary_path }}
        MAXIMUM_FINDINGS: ${{ inputs.maximum-findings-per-tool }}
      run: |
        $scriptPath = Join-Path `
          $env:TOOLKIT_ROOT `
          "scripts\generate-summary.ps1"

        & $scriptPath `
          -ResultsDirectory $env:RESULTS_DIRECTORY `
          -SummaryPath $env:SUMMARY_PATH `
          -ChangedFilesPath $env:CHANGED_FILES_PATH `
          -MaximumDisplayedFindingsPerTool ([int]$env:MAXIMUM_FINDINGS)

        exit $LASTEXITCODE
    - name: Generate CRM QA ticket payload
      if: always()
      continue-on-error: true
      shell: pwsh
      env:
        TOOLKIT_ROOT: ${{ steps.paths.outputs.toolkit_root }}
        REPOSITORY_ROOT: ${{ steps.paths.outputs.repository_root }}
        CHANGED_FILES_PATH: ${{ steps.paths.outputs.changed_files_path }}
        RESULTS_SOURCE: ${{ steps.paths.outputs.results_directory }}
        REPORTS_ROOT: ${{ steps.paths.outputs.reports_root }}
        BASE_REFERENCE: ${{ inputs.base-reference }}
        HEAD_REFERENCE: ${{ inputs.head-reference }}
        REPOSITORY_NAME: ${{ github.repository }}
        BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
      run: |
        $ErrorActionPreference = "Stop"

        $crmDirectory = Join-Path $env:REPORTS_ROOT "crm"
        New-Item -ItemType Directory -Path $crmDirectory -Force | Out-Null

        $outputPath = Join-Path $crmDirectory "crm-tickets.json"
        $scriptPath = Join-Path $env:TOOLKIT_ROOT "scripts\crm\generate-crm-tickets.mjs"

        if (-not (Test-Path -LiteralPath $scriptPath -PathType Leaf)) {
          throw "CRM ticket generator was not found: $scriptPath"
        }

        node $scriptPath `
          $env:REPOSITORY_ROOT `
          $env:CHANGED_FILES_PATH `
          $env:RESULTS_SOURCE `
          $outputPath `
          $env:BASE_REFERENCE `
          $env:HEAD_REFERENCE `
          $env:REPOSITORY_NAME `
          $env:BRANCH_NAME

        if ($LASTEXITCODE -ne 0) {
          throw "CRM QA ticket payload generation failed with exit code $LASTEXITCODE."
        }

        Write-Host "CRM QA ticket payload: $outputPath"

    - name: Build backend repository
      id: build
      if: always()
      continue-on-error: true
      shell: powershell
      env:
        REPOSITORY_ROOT: ${{ steps.paths.outputs.repository_root }}
        BUILD_RESULT_PATH: ${{ steps.paths.outputs.build_result_path }}
      run: |
        $ErrorActionPreference = "Stop"

        $startedAt = Get-Date
        $phase = "install"
        $exitCode = 0
        $capturedLines = New-Object System.Collections.Generic.List[string]

        function Add-BuildLine {
          param([AllowNull()][object]$Value)

          if ($null -eq $Value) {
            return
          }

          $text = [string]$Value
          Write-Host $text
          [void]$capturedLines.Add($text)
        }

        Push-Location $env:REPOSITORY_ROOT

        try {
          # CI-only local placeholders. Prisma Client generation requires
          # datasource values but `prisma generate` does not connect to them.
          $env:APP_ENV = "local"
          $env:DATABASE_URL = "postgresql://ci:ci@127.0.0.1:5432/gr8booksneo_dev?schema=public"
          $env:DIRECT_URL = "postgresql://ci:ci@127.0.0.1:5432/gr8booksneo_dev?schema=public"

          Add-BuildLine "Installing backend repository dependencies..."

          # Windows PowerShell 5.1 can surface native stderr (including harmless
          # npm warnings) as PowerShell error records. Do not let warnings stop
          # the step; use npm's real process exit code as the source of truth.
          $previousErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = "Continue"

          npm ci 2>&1 | ForEach-Object {
            Add-BuildLine $_
          }

          $npmCiExitCode = $LASTEXITCODE
          $ErrorActionPreference = $previousErrorActionPreference

          if ($npmCiExitCode -ne 0) {
            $exitCode = $npmCiExitCode
            throw "Backend npm ci failed with exit code $exitCode."
          }

          $phase = "build"
          Add-BuildLine "Running backend production build..."

          $previousErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = "Continue"

          npm run build 2>&1 | ForEach-Object {
            Add-BuildLine $_
          }

          $npmBuildExitCode = $LASTEXITCODE
          $ErrorActionPreference = $previousErrorActionPreference

          if ($npmBuildExitCode -ne 0) {
            $exitCode = $npmBuildExitCode
            throw "Backend npm run build failed with exit code $exitCode."
          }

          $phase = "complete"
          Add-BuildLine "Backend build passed."
        }
        catch {
          if ($exitCode -eq 0) {
            $exitCode = 1
          }

          Add-BuildLine $_.Exception.Message
        }
        finally {
          Pop-Location
        }

        $durationMs = [int]((Get-Date) - $startedAt).TotalMilliseconds

        $importantErrors = @(
          $capturedLines |
            Where-Object {
              $_ -match "error TS[0-9]+|Cannot find module|Module not found|Property '.+' does not exist|has no exported member|Nest build|npm error|npm ERR!|^Error:"
            } |
            ForEach-Object { $_.Trim() } |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
            Select-Object -Unique -First 20
        )

        if ($exitCode -ne 0 -and $importantErrors.Count -eq 0) {
          $importantErrors = @(
            $capturedLines |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
              Select-Object -Last 12
          )
        }

        $buildResult = [ordered]@{
          status = if ($exitCode -eq 0) { "passed" } else { "failed" }
          phase = $phase
          exitCode = $exitCode
          durationMs = $durationMs
          errors = @($importantErrors)
        }

        $buildResult |
          ConvertTo-Json -Depth 6 |
          Set-Content `
            -LiteralPath $env:BUILD_RESULT_PATH `
            -Encoding UTF8

        Write-Host "Backend build result written to: $env:BUILD_RESULT_PATH"

        if ($exitCode -ne 0) {
          exit $exitCode
        }

    - name: Generate PR dashboard
      if: always()
      continue-on-error: true
      shell: powershell
      env:
        TOOLKIT_ROOT: ${{ steps.paths.outputs.toolkit_root }}
        REPOSITORY_ROOT: ${{ steps.paths.outputs.repository_root }}
        RESULTS_DIRECTORY: ${{ steps.paths.outputs.results_directory }}
        CHANGED_FILES_PATH: ${{ steps.paths.outputs.changed_files_path }}
        BUILD_RESULT_PATH: ${{ steps.paths.outputs.build_result_path }}
      run: |
        $scriptPath = Join-Path `
          $env:TOOLKIT_ROOT `
          "scripts\generate-dashboard.ps1"

        $templatePath = Join-Path `
          $env:TOOLKIT_ROOT `
          "templates\dashboard.html"

        $outputPath = Join-Path `
          $env:REPOSITORY_ROOT `
          "reports\QA-Report.html"

        & $scriptPath `
          -ToolkitRoot $env:TOOLKIT_ROOT `
          -RepositoryRoot $env:REPOSITORY_ROOT `
          -ResultsDirectory $env:RESULTS_DIRECTORY `
          -ChangedFilesPath $env:CHANGED_FILES_PATH `
          -TemplatePath $templatePath `
          -OutputPath $outputPath `
          -BuildResultPath $env:BUILD_RESULT_PATH

        if (-not $?) {
          throw "PR dashboard generation failed."
        }

        exit 0

    - name: Install Playwright Chromium
      if: always()
      continue-on-error: true
      shell: pwsh
      env:
        TOOLKIT_ROOT: ${{ steps.paths.outputs.toolkit_root }}
      run: |
        Push-Location $env:TOOLKIT_ROOT

        try {
          $playwrightCli = Join-Path $env:TOOLKIT_ROOT "node_modules\playwright\cli.js"

          if (-not (Test-Path -LiteralPath $playwrightCli -PathType Leaf)) {
            throw "Local Playwright CLI was not found: $playwrightCli"
          }

          node $playwrightCli install chromium

          if ($LASTEXITCODE -ne 0) {
            throw "Playwright Chromium installation failed with exit code $LASTEXITCODE."
          }

          node -e "import('playwright').then(({chromium}) => { const fs = require('node:fs'); const p = chromium.executablePath(); console.log('Chromium executable:', p); if (!fs.existsSync(p)) process.exit(1); })"

          if ($LASTEXITCODE -ne 0) {
            throw "Playwright Chromium executable verification failed."
          }
        }
        finally {
          Pop-Location
        }

    - name: Publish QA tickets to CRM
      shell: pwsh
      env:
        CRM_DRY_RUN: "false"
        CRM_MAX_TICKETS: "200"
        TOOLKIT_ROOT: ${{ steps.paths.outputs.toolkit_root }}
        REPORTS_ROOT: ${{ steps.paths.outputs.reports_root }}
      run: |
        $ErrorActionPreference = "Stop"

        $ticketPath = Join-Path $env:REPORTS_ROOT "crm\crm-tickets.json"
        $scriptPath = Join-Path $env:TOOLKIT_ROOT "scripts\crm\publish-crm-tickets.mjs"

        if (-not (Test-Path -LiteralPath $ticketPath -PathType Leaf)) {
          throw "CRM ticket payload was not found: $ticketPath"
        }

        if (-not (Test-Path -LiteralPath $scriptPath -PathType Leaf)) {
          throw "CRM ticket publisher was not found: $scriptPath"
        }

        Write-Host "Publishing CRM QA tickets..."
        node $scriptPath $ticketPath

        if ($LASTEXITCODE -ne 0) {
          throw "CRM QA ticket publishing failed with exit code $LASTEXITCODE."
        }

        Write-Host "CRM QA ticket publishing completed."

    - name: Capture PR dashboard PNG
      if: always()
      continue-on-error: true
      shell: pwsh
      env:
        TOOLKIT_ROOT: ${{ steps.paths.outputs.toolkit_root }}
        REPOSITORY_ROOT: ${{ steps.paths.outputs.repository_root }}
      run: |
        $captureScript = Join-Path `
          $env:TOOLKIT_ROOT `
          "scripts\capture-dashboard.mjs"

        $htmlPath = Join-Path `
          $env:REPOSITORY_ROOT `
          "reports\QA-Report.html"

        $pngPath = Join-Path `
          $env:REPOSITORY_ROOT `
          "reports\QA-Report.png"

        Push-Location $env:TOOLKIT_ROOT

        try {
          node $captureScript $htmlPath $pngPath

          if ($LASTEXITCODE -ne 0) {
            throw "Dashboard screenshot generation failed with exit code $LASTEXITCODE."
          }
        }
        finally {
          Pop-Location
        }

    - name: Enforce final QA result
      if: always()
      shell: pwsh
      env:
        OVERALL_STATUS: ${{ steps.summary.outputs.overall_status }}
        BUILD_OUTCOME: ${{ steps.build.outcome }}
        BRANCH_FRESHNESS_OUTCOME: ${{ steps.branch_freshness.outcome }}
        BRANCH_BEHIND_COUNT: ${{ steps.branch_freshness.outputs.behind-count }}
      run: |
        $status = $env:OVERALL_STATUS

        if ($env:BRANCH_FRESHNESS_OUTCOME -eq "failure") {
          $behindCount = if ([string]::IsNullOrWhiteSpace($env:BRANCH_BEHIND_COUNT)) {
            "unknown number of"
          }
          else {
            $env:BRANCH_BEHIND_COUNT
          }

          Write-Error "Backend branch is outdated ($behindCount commit(s) behind the PR base). Merge the latest develop into the feature branch and push again."
          exit 1
        }

        if ($env:BUILD_OUTCOME -eq "failure") {
          Write-Error "Backend production build failed. Review the Production Build blocker in the QA dashboard."
          exit 1
        }

        if ([string]::IsNullOrWhiteSpace($status)) {
          Write-Error "The QA summary did not provide an overall status."
          exit 1
        }

        Write-Host "Backend PR Quality status: $status"

        switch ($status) {
          "PASSED" {
            Write-Host "No blocking advisory findings were detected."
            exit 0
          }

          "WARNING" {
            Write-Warning "The PR passed with advisory findings."
            exit 0
          }

          "SKIPPED" {
            Write-Host "No relevant files required advisory analysis."
            exit 0
          }

          "FAILED" {
            Write-Error "Blocking PR quality findings were detected."
            exit 1
          }

          "ERROR" {
            Write-Error "One or more QA analyzers failed to complete."
            exit 1
          }

          default {
            Write-Error "Unknown QA status: $status"
            exit 1
          }
        }