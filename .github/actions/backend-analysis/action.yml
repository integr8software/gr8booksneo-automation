name: Gr8Books Neo Backend Analysis

description: >
  Runs architecture, circular dependency,
  dead-code analysis and generates a unified QA report.

inputs:

  source-path:
    description: Backend source directory
    required: false
    default: src

  tsconfig-path:
    description: TypeScript configuration
    required: false
    default: tsconfig.json

runs:

  using: composite

  steps:

    - name: Resolve Paths
      shell: powershell
      run: |

        $toolkitRoot = Resolve-Path "$env:GITHUB_ACTION_PATH\..\..\.."

        $sourcePath = Join-Path `
            $env:GITHUB_WORKSPACE `
            "${{ inputs.source-path }}"

        $tsConfigPath = Join-Path `
            $env:GITHUB_WORKSPACE `
            "${{ inputs.tsconfig-path }}"

        $reportDir = Join-Path `
            $env:GITHUB_WORKSPACE `
            "reports"

        "QA_TOOLKIT_ROOT=$toolkitRoot" |
            Out-File $env:GITHUB_ENV `
            -Append

        "QA_SOURCE_PATH=$sourcePath" |
            Out-File $env:GITHUB_ENV `
            -Append

        "QA_TSCONFIG_PATH=$tsConfigPath" |
            Out-File $env:GITHUB_ENV `
            -Append

        "QA_REPORT_DIR=$reportDir" |
            Out-File $env:GITHUB_ENV `
            -Append

    - name: Install QA Toolkit
      shell: powershell
      run: |

        npm ci `
            --prefix "$env:QA_TOOLKIT_ROOT"

    - name: Architecture Analysis
      shell: powershell
      run: |

        & "$env:QA_TOOLKIT_ROOT\scripts\architecture.ps1" `
            -ToolkitRoot "$env:QA_TOOLKIT_ROOT" `
            -SourcePath "$env:QA_SOURCE_PATH" `
            -TsConfigPath "$env:QA_TSCONFIG_PATH" `
            -ReportDir "$env:QA_REPORT_DIR"

    - name: Circular Dependency Analysis
      shell: powershell
      run: |

        & "$env:QA_TOOLKIT_ROOT\scripts\circular.ps1" `
            -ToolkitRoot "$env:QA_TOOLKIT_ROOT" `
            -SourcePath "$env:QA_SOURCE_PATH" `
            -TsConfigPath "$env:QA_TSCONFIG_PATH" `
            -ReportDir "$env:QA_REPORT_DIR"

    - name: Dead Code Analysis
      shell: powershell
      run: |

        & "$env:QA_TOOLKIT_ROOT\scripts\deadcode.ps1" `
            -ToolkitRoot "$env:QA_TOOLKIT_ROOT" `
            -TsConfigPath "$env:QA_TSCONFIG_PATH" `
            -ReportDir "$env:QA_REPORT_DIR"

    - name: Generate QA Summary
      if: always()
      shell: powershell
      run: |

        & "$env:QA_TOOLKIT_ROOT\scripts\generate-summary.ps1" `
            -ReportDir "$env:QA_REPORT_DIR"